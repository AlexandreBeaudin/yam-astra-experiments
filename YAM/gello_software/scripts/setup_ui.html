<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YAM 工位配置向导</title><style>
body{margin:0;background:#edf2f7;color:#203048;font:16px system-ui}main{max-width:940px;margin:30px auto;padding:24px}section{background:white;border-radius:16px;padding:24px;margin:20px 0;box-shadow:0 3px 18px #20304810}h1{font-size:28px}h2{font-size:20px}label{display:block;margin:14px 0}input,select{display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #b4c2d3;border-radius:7px;margin-top:7px}button{padding:11px 18px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:default}.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}.hint{color:#64748b}#message{position:sticky;top:10px;padding:18px;white-space:pre-wrap;border-radius:10px;background:#dbeafe;z-index:2}img{max-width:100%}input[type=checkbox]{display:inline;width:auto}a{color:#2563eb}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style><main><h1>YAM 工位配置向导</h1><p>导入平台接入文件，确认左右双臂和三个相机视角，检查后应用。</p><p id="message" role="status">正在扫描设备…</p>
<section><h2>1 · 平台接入</h2><label>管理员下载的接入配置（已有工位可保持原配置）<input id="bundle" type="file" accept=".json"></label><p id="identity"></p><div class="row"><label>HTTPS证书路径<input id="tls_cert" placeholder="已有证书可留空"></label><label>HTTPS私钥路径<input id="tls_key" placeholder="已有私钥可留空"></label></div><p class="hint">系统安装、串口权限及可信HTTPS证书由部署人员预先准备。凭据只写入本机私有配置。</p></section>
<section><h2>2 · 主从臂对应</h2><button id="scan">重新扫描</button><p class="hint">按USB序列号选择；可以逐个拔插识别。CAN序列号属于适配器，仍需现场确认适配器后接的是哪台从臂。</p><div class="row" id="arms"></div></section>
<section><h2>3 · 三个相机视角</h2><p class="hint">按序列号绑定，可拍照确认画面。保持原始方向，不旋转。</p><div id="cameras"></div></section>
<section><h2>4 · 检查与应用</h2><label>本地数据目录<input id="storage"></label><p>新硬件必须上传自己的主臂零点、方向和夹爪标定YAML；本向导不自动标定或使能电机。原配置保留在旧文件或历史版本目录。</p><button id="validate">检查配置</button><label><input id="confirmed" type="checkbox">已确认左右设备、相机视角和标定归属；双臂已可靠支撑并下使能</label><button id="apply" disabled>应用配置并重启设备服务</button></section></main>
<script>
const token=__TOKEN__;let state,bundle=null,busy=false,validated=false;
const $=id=>document.getElementById(id),msg=(s,error=false)=>{$('message').textContent=s;$('message').style.background=error?'#fee2e2':'#dcfce7'};
function invalidate(){validated=false;$('apply').disabled=true;}
async function fileText(id){return $(id).files[0]?await $(id).files[0].text():null;}
async function body(){let arms={},cameras={},calibrations={};for(const s of ['left','right']){arms[s]={leader:$(s+'-leader').value,can:$(s+'-can').value};calibrations[s]=await fileText(s+'-calibration');}for(const r of ['main','left','right'])cameras[r]=$(r+'-camera').value;return {revision:state.revision,bundle,arms,cameras,calibrations,tls_cert:$('tls_cert').value,tls_key:$('tls_key').value,storage:$('storage').value,confirmed:$('confirmed').checked};}
async function request(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-YAM-Setup':token},body:JSON.stringify(data)});let b=await r.json();if(!r.ok)throw Error(b.error);return b;}
async function run(f){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await f();}catch(e){msg(e.message,true);}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('apply').disabled=!validated||!$('confirmed').checked;}}
function select(id,options,value){let node=document.createElement('select');node.id=id;node.add(new Option('请选择',''));for(const o of options)node.add(new Option(o.label,o.value));node.value=value||'';node.onchange=invalidate;return node;}
async function scan(){invalidate();state=await (await fetch('/api/inventory')).json();$('identity').textContent='当前工位：'+(state.current.station_id||'尚未配置');$('arms').replaceChildren();$('cameras').replaceChildren();for(const side of ['left','right']){let box=document.createElement('div');let h=document.createElement('h3');h.textContent=side==='left'?'左侧':'右侧';box.append(h);for(const k of ['leader','can']){let label=document.createElement('label');label.textContent=k==='leader'?'主臂USB串口':'从臂CAN适配器';let options=k==='leader'?state.inventory.leaders.map(x=>({value:x.path,label:x.path+(x.readable?'':'（无权限）')})):state.inventory.cans.map(x=>({value:x.channel,label:x.channel+' · '+x.serial}));label.append(select(side+'-'+k,options,state.current.arms[side]?.[k]));box.append(label);}let label=document.createElement('label');label.textContent='对应硬件的标定YAML（未更换硬件可留空）';let input=document.createElement('input');input.type='file';input.accept='.yaml,.yml';input.id=side+'-calibration';label.append(input);box.append(label);$('arms').append(box);}
for(const role of ['main','left','right']){let box=document.createElement('div');let label=document.createElement('label');label.textContent={main:'主视角',left:'左腕',right:'右腕'}[role];label.append(select(role+'-camera',state.inventory.cameras.map(x=>({value:x.serial,label:x.model+' · '+x.serial})),state.current.cameras[role]));box.append(label);let button=document.createElement('button');button.textContent='拍照确认';let img=document.createElement('img');button.onclick=()=>run(async()=>{msg('正在拍摄单帧，请稍候…');let r=await request('/api/camera',{serial:$(role+'-camera').value});img.src='data:image/jpeg;base64,'+r.image;msg('请核对视角，然后继续配置。');});box.append(button,img);$('cameras').append(box);}$('storage').value=state.current.storage;msg(state.inventory.warning||'扫描完成，请确认设备对应关系。');}
$('bundle').onchange=()=>run(async()=>{invalidate();bundle=JSON.parse(await fileText('bundle'));$('identity').textContent='待接入：'+bundle.device_id+' / '+bundle.station_id;msg('接入文件已读取，继续确认硬件。');});$('scan').onclick=()=>run(scan);
$('validate').onclick=()=>run(async()=>{let r=await request('/api/validate',await body());validated=true;msg(r.message);});$('apply').onclick=()=>run(async()=>{let r=await request('/api/apply',await body());invalidate();msg(r.message);});document.addEventListener('change',e=>{if(e.target.id==='confirmed')$('apply').disabled=busy||!validated||!e.target.checked;else invalidate();});document.addEventListener('input',e=>{if(e.target.id!=='confirmed')invalidate();});run(scan);
</script></html>
