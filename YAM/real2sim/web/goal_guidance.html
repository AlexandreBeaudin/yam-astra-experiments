<!doctype html><html lang="zh"><meta charset="utf-8"><title>连续采集指引</title>
<style>body{font:16px system-ui;background:#101826;color:#e4edf8;max-width:1150px;margin:24px auto}button,select,input{font:inherit;padding:9px;margin:5px;background:#26364c;color:white;border:1px solid #62748b;border-radius:5px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}section{background:#1a273a;padding:16px;margin:15px 0;border-radius:12px}.warn{color:#ffc66d}canvas{width:min(100%,640px);height:auto;background:#283647}td,th{padding:8px;border:1px solid #42536a}table{border-collapse:collapse}small{color:#abc}.row{display:flex;flex-wrap:wrap;gap:12px}.camera{width:230px;max-width:100%}</style>
<h1 id="title">连续采集指引</h1><p id="mode" class="warn">连接中…</p>
<section><p id="task-note" class="warn"></p><label><input id="field-test" type="checkbox" disabled>现场试采模式（仅训练布局；记录为 field_test）</label><p id="field-progress"></p><b>任务物料</b><p id="materials"></p><small>任务清单仅供查看；实际摆放留待录制后与第一帧核对。</small></section>
<section><div><button id="prev">← 上一条指引</button><select id="layout"></select><button id="next">下一条指引 →</button><label>投影透明度 <input id="alpha" type="range" min="0" max="100" value="50"></label></div><p id="detail"></p><p id="selectionState" class="warn"></p><p id="split-progress"></p><small id="projection-style"></small><div class="row"><canvas id="view" width="640" height="480"></canvas><div><p>左腕</p><img id="leftCam" class="camera"><p>右腕</p><img id="rightCam" class="camera"><div id="frontPanel" hidden><p>前视</p><img id="frontCam" class="camera"></div></div></div><small>按指引摆放后，直接用原按钮开始／结束录制。停止录制并保存完成后自动切换下一条；手动遥操还原并按新指引摆放，即可继续录制。最后一条不循环。</small></section>
<section><h2>录制状态</h2><p id="collectorState">等待数采进程</p><p id="episode"></p><button id="fail" disabled>上一条标记失败并退回指引</button><small>将最近保存的完整轨迹移入 fail 文件夹，不计入有效覆盖，可重新录制同一摆放。</small><p>每条轨迹自动保存录制开始时的布局、透明投影和“投影＋数据第一帧”对照图。此处只保存指导目标，不判定实际摆放已通过。</p><p id="message" class="warn"></p></section>
<section><h2>指引分布记录</h2><p>按开始录制时保存的目标分层统计；实际物体分布与数据质量尚待核对。</p><table id="coverage"></table></section>
<script>
let data,selected=null,mode='offline',frame=new Image(),overlay=new Image(),busy=false,pollBusy=false,lastState=null,liveConfig=null;
const $=id=>document.getElementById(id),ctx=$('view').getContext('2d');
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
function paint(){ctx.fillStyle='#283647';ctx.fillRect(0,0,640,480);if(frame.complete&&frame.naturalWidth)ctx.drawImage(frame,0,0);ctx.globalAlpha=selected?.opacity??.5;if(overlay.complete&&overlay.naturalWidth)ctx.drawImage(overlay,0,0);ctx.globalAlpha=1}
function trial(){return $('field-test').checked}
function pool(){return trial()?liveConfig.field_test_layout_ids.map(id=>data.layouts.find(l=>l.id===id)):data.layouts}
function options(){const list=pool();$('layout').replaceChildren();for(const l of list){const o=document.createElement('option');o.value=l.id;o.textContent=l.id+' · '+(l.split==='train'?'训练':l.split==='validation'?'验证':'未分组');$('layout').append(o)}}
function binLabel(i){const t=data.task,a=Math.floor(i/3),b=i%3;if(t.adapter==='goal_scoring')return `距离 ${t.distance_edges_m[a]*100}–${t.distance_edges_m[a+1]*100} cm / 入射角 ${t.angle_edges_deg[b]}–${t.angle_edges_deg[b+1]}°`;if(t.adapter==='mortar_pestle')return `研钵 X ${t.bowl_x_edges_m[a]}–${t.bowl_x_edges_m[a+1]} m / 研杵 ${t.pestle_yaw_edges_deg[b]}–${t.pestle_yaw_edges_deg[b+1]}°`;return '分组 '+i}
function buttons(){const recording=!!lastState?.collector?.active_episode;const locked=busy||recording;const r=lastState?.collector?.recording;$('fail').disabled=locked||!lastState?.collector?.connected||r?.status!=='recording_stopped'||!r?.episode_id||r?.quality_control==='failed';const i=selected?pool().findIndex(l=>l.id===selected.layout_id):-1;$('prev').disabled=locked||i<=0;$('next').disabled=locked||i<0||i>=pool().length-1;$('layout').disabled=locked;$('alpha').disabled=locked;$('field-test').disabled=locked||!liveConfig}
function show(s){selected=s;const isTrial=s.capture_phase==='field_test';if(trial()!==isTrial&&liveConfig){$('field-test').checked=isTrial;options()}$('layout').value=s.layout_id;$('alpha').value=s.opacity*100;overlay.src=s.layout_id+'.png';const l=s.layout,i=data.layouts.findIndex(l=>l.id===s.layout_id);let detail=`指引 ${i+1} / ${data.layouts.length} · ${s.layout_id} · ${l.split==='train'?'训练集':l.split==='validation'?'验证集':'未分组'} · ${isTrial?'现场试采':'正式采集'}`;if(data.task.adapter==='goal_scoring')detail+=` · ${l.arm===1?'左':'右'}臂 · 球门朝向 ${l.goal_yaw_deg.toFixed(1)}°`;if(data.task.adapter==='mortar_pestle')detail+=` · 左臂取杵／右臂捣压 · 研杵 ${l.pestle_yaw_deg.toFixed(1)}°`; $('detail').textContent=detail;buttons();paint()}

async function select(id,opacity){if(busy)return;busy=true;buttons();$('selectionState').textContent='正在切换，请等待指引就绪…';try{const s=await api('/api/select',{layout_id:id,opacity,capture_phase:trial()?'field_test':'collection'});if(lastState?.collector?.connected){let ok=false;for(let i=0;i<50;i++){const state=await api('/api/state');if(state.collector?.selected_revision===s.revision){ok=true;break}await new Promise(r=>setTimeout(r,100))}if(!ok)throw Error('数采端尚未加载目标，请稍后重试')}show(s);$('selectionState').textContent=mode==='live'?'指引已就绪，摆放后直接按原按钮录制。':'离线预览；启动数采后将加载此指引。';$('message').textContent=''}catch(e){$('message').textContent=e.message;if(selected)show(selected)}finally{busy=false;buttons()}}
async function poll(){if(pollBusy||!data)return;pollBusy=true;try{const s=await api('/api/state');lastState=s;mode=s.mode;const splits=s.recorded_unique_layouts||{};$('split-progress').textContent=`本版本已录制目标关联：训练 ${splits.train||0}/${data.layouts.filter(l=>l.split==='train').length} 个布局；验证 ${splits.validation||0}/${data.layouts.filter(l=>l.split==='validation').length} 个布局。真实摆放仍待首帧核对。`;$('field-progress').textContent=`现场试采已关联 ${s.recorded_phase_counts?.field_test||0} 条轨迹，不计入正式覆盖；实际摆放仍待首帧核对。`;const c=s.collector||{},r=c.recording||{};$('mode').textContent=mode==='live'?'实时数采模式 · 无需标点，无核对有效期':'离线预览 · 未连接真实数采';$('collectorState').textContent=c.connected?(c.active_episode?'正在录制':r.status==='recording'?'正在保存…':'等待开始下一条'):(c.error||'未连接数采进程');$('episode').textContent=r.episode_path?`${r.episode_path.split('/').pop()} · ${r.guidance?'保存指引 '+r.guidance.layout_id:'未保存指引'} · ${r.frame_count} 帧 · ${r.quality_control==='failed'?'已标记失败，已移入 fail':'待核对'}`:'';
buttons();if(!busy){if(s.selection&&(!c.connected||c.selected_revision===s.selection.revision)){if(selected?.revision!==s.selection.revision)show(s.selection)}else if(c.connected||mode!=='live'){await select(selected?.layout_id||data.layouts[0].id,selected?.opacity??.5)}}
$('coverage').replaceChildren();const head=document.createElement('tr');for(const t of ['分层','候选数','正式轨迹数']){const c=document.createElement('th');c.textContent=t;head.append(c)}$('coverage').append(head);data.coverage.forEach((n,i)=>{const row=document.createElement('tr');for(const v of [binLabel(i),n,s.recorded_guidance_counts[i]||0]){const c=document.createElement('td');c.textContent=v;row.append(c)}$('coverage').append(row)});

}catch(e){$('message').textContent=e.message}finally{pollBusy=false}}
let imagesBusy=false;async function images(){if(imagesBusy||!data)return;imagesBusy=true;try{const names=lastState?.collector?.connected?['top',...lastState.collector.cameras.filter(n=>n!=='top')]:['top'];await Promise.all(names.map(async name=>{const r=await fetch('/api/camera/'+name+'?t='+Date.now());if(!r.ok){if(name==='top')$('message').textContent='相机画面未更新，请检查数采连接';else $(name+'Cam')?.removeAttribute('src');return}const url=URL.createObjectURL(await r.blob()),im=name==='top'?frame:$(name+'Cam');if(!im){URL.revokeObjectURL(url);return}im.onload=()=>{URL.revokeObjectURL(url);if(name==='top')paint()};im.onerror=()=>URL.revokeObjectURL(url);im.src=url;if(name==='front')$('frontPanel').hidden=false}))}catch(e){$('message').textContent='相机预览连接中断'}finally{imagesBusy=false}}
$('prev').onclick=()=>{const i=pool().findIndex(l=>l.id===selected.layout_id);if(i>0)select(pool()[i-1].id,selected.opacity)};$('next').onclick=()=>{const i=pool().findIndex(l=>l.id===selected.layout_id);if(i<pool().length-1)select(pool()[i+1].id,selected.opacity)};$('layout').onchange=()=>select($('layout').value,selected?.opacity??.5);$('alpha').onchange=()=>select(selected.layout_id,Number($('alpha').value)/100);
$('fail').onclick=async()=>{const r=lastState?.collector?.recording;if(!r?.episode_id||busy)return;busy=true;buttons();try{const result=await api('/api/fail',{episode_id:r.episode_id});$('message').textContent='已移入 '+result.episode_path+'；已恢复此条指引，请重新摆放录制。'}catch(e){$('message').textContent=e.message}finally{busy=false;await poll();buttons()}};
$('field-test').onchange=async()=>{options();await select(pool()[0].id,selected?.opacity??.5)};
async function init(){data=await(await fetch('manifest.json')).json();const r=await fetch('live_guidance.json');if(r.ok){liveConfig=await r.json();$('field-test').disabled=false}$('projection-style').textContent=data.render_kind==='isaac_asset_rgba'?'仿真资产渲染叠加 · 标定相机视角 · 背景透明 · 透明度可调':'几何投影指引';document.title=data.task.task_id+' 连续采集指引';$('title').textContent=data.task.task_id+' · '+data.task.task_name;$('task-note').textContent=data.task.adapter==='mortar_pestle'?'研杵横放；左臂取杵、交给右臂；粘土暂定直径30 mm、放在碗中央。当前通过初始摆放/工作空间初筛，未验证抓取交接和捣压物理成功。':'';$('materials').textContent=data.required_materials.map(m=>`${m.material_id} ${m.name} × ${m.quantity}${m.quantity_unit?'（'+m.quantity_unit+'）':''}`).join('；');options();overlay.onload=paint;await poll();images();setInterval(poll,500);setInterval(images,100)}init().catch(e=>$('message').textContent=e.message);
</script></html>
