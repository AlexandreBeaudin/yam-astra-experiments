<!doctype html><html lang="zh"><meta charset="utf-8"><title>Stack cups · 初始摆放指导</title>
<style>
body{margin:0;background:#101724;color:#e8edf5;font:15px system-ui}main{max-width:1360px;margin:auto;padding:26px}h1{font-size:26px;margin:0 0 8px}p{color:#aebbd0;line-height:1.6}button,select,input,textarea{font:inherit;background:#223248;color:#eef4ff;border:1px solid #42536e;border-radius:7px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.panel{background:#182436;padding:18px;border-radius:12px;margin:14px 0}.row{display:flex;gap:18px;flex-wrap:wrap}.view{flex:1;min-width:450px}canvas,img{width:100%;border-radius:8px}.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{border:2px solid transparent;padding:5px;border-radius:8px;cursor:pointer}.card.selected{border-color:#41d1be}.card span{font-size:12px}.good{color:#69e2b2}.warn{color:#ffd185}#status{white-space:pre-wrap;line-height:1.5}textarea{width:95%;height:70px}label{display:inline-block;margin:8px 12px 8px 0}a{color:#7ccffc}
</style><main>
<h1>Stack cups · 初始摆放指导</h1><p id="mode">录制首帧测试 · 尚未连接实时相机</p>
<div class="panel"><strong id="summary"></strong><p id="coverage">实际摆放覆盖尚未读取</p><p>纸杯 v1：估计尺寸。绿色布局通过 top 完整入镜、遮挡、间距、6D 位置与姿态 IK、静置检查。抓取路径碰撞和叠杯成功率尚未验证。</p>
<label>布局 <select id="select"></select></label><label>目标透明度 <input id="alpha" type="range" min="0" max="100" value="50"> <span id="alphaValue">50%</span></label>
<button id="refresh">刷新并冻结真实画面</button> <button id="annotate">标注实际摆放</button> <button id="save" disabled>核验并保存</button>
</div>
<div class="row"><div class="panel view"><strong>真实画面 + 目标物体投影</strong><p>标注顺序：左臂源杯 → 中间目标杯 → 右臂源杯。点击杯口圆心；仅适用于直立杯。</p><canvas id="overlay" width="640" height="480"></canvas></div><div class="panel view"><strong>仿真 top 视角</strong><p id="detail"></p><img id="sim"></div></div>
<div class="panel" id="status">加载布局…</div><div class="panel"><strong>已生成布局</strong><div class="gallery" id="gallery"></div></div>
<div class="panel"><details><summary>手动 / VLM 候选接口</summary><p>候选只提供三个杯底中心的世界坐标，单位米，顺序同上。校验结果由系统计算。修改后必须重新渲染和静置，才可用于采集指导。</p><textarea id="positions"></textarea><button id="validate">检查候选</button><button id="export">导出候选 JSON</button><p id="manualResult"></p></details></div>
</main><script>
let data=/*DATA*/{}, selected=0, marks=[], marking=false, frameId=null, online=location.protocol.startsWith('http');
const $=id=>document.getElementById(id), canvas=$('overlay'), ctx=canvas.getContext('2d');
let real=new Image(), props=new Image(); real.onload=draw; props.onload=draw;
function draw(){ctx.clearRect(0,0,640,480); if(real.complete&&real.naturalWidth)ctx.drawImage(real,0,0);ctx.globalAlpha=+$('alpha').value/100;if(props.complete&&props.naturalWidth)ctx.drawImage(props,0,0);ctx.globalAlpha=1;marks.forEach((p,i)=>{ctx.strokeStyle='#ff615c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(...p,7,0,7);ctx.stroke();ctx.fillStyle='#ff615c';ctx.font='18px sans-serif';ctx.fillText(i+1,p[0]+10,p[1]);});}
function choose(i){selected=i; marks=[]; marking=false;$('save').disabled=true;let l=data.layouts[i];props.src=l.id+'/props.png';$('sim').src=l.id+'/top.png';$('positions').value=JSON.stringify(l.positions_m);$('select').value=i;$('detail').textContent=l.id+' · '+l.tags.family+' · '+(l.guidance_ready?'通过布局检查':'未通过，不能保存核验');$('status').textContent=JSON.stringify({layout:l.id,ready:l.guidance_ready,visible_fraction:l.render_visibility?.visible_fraction,static_physics:l.static_physics?.passed,IK_waypoints:l.validation.waypoint_ik.length},null,2);document.querySelectorAll('.card').forEach((e,j)=>e.classList.toggle('selected',i===j));draw();}
async function refresh(){marks=[];marking=false;frameId=null;$('save').disabled=true;try{if(!online){real.src='reference.jpg';return;}const response=await fetch('/api/frame');if(!response.ok)throw Error((await response.json()).error);frameId=response.headers.get('X-Frame-Id');const url=URL.createObjectURL(await response.blob());real.onload=()=>{draw();URL.revokeObjectURL(url)};real.src=url;$('status').textContent='画面已冻结。可以标注三个杯口圆心。';}catch(e){$('status').textContent='相机不可用：'+e.message;}}
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let result=await r.json();if(!r.ok)throw Error(result.error);return result;}
$('alpha').oninput=()=>{$('alphaValue').textContent=$('alpha').value+'%';draw()};$('select').onchange=e=>choose(+e.target.value);$('refresh').onclick=refresh;
$('annotate').onclick=()=>{marks=[];marking=true;$('save').disabled=true;$('status').textContent='依次点击三个实际杯口圆心：左源杯、中间目标杯、右源杯。';draw()};
canvas.onclick=e=>{if(!marking||marks.length>=3)return;let r=canvas.getBoundingClientRect();marks.push([(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*480/r.height]);draw();$('save').disabled=!(marks.length===3&&frameId&&data.layouts[selected].guidance_ready);};
$('save').onclick=async()=>{try{let result=await post('/api/placement',{layout_id:data.layouts[selected].id,rim_pixels:marks,frame_id:frameId});$('status').textContent=(result.accepted?'摆放误差在测试阈值内':'摆放未通过')+' · '+result.input_mode+'\n每杯平面偏差（毫米）：'+result.error_xy_m.map(x=>(x*1000).toFixed(1)).join(' / ')+'\n已保存原图与核验记录：'+result.id; }catch(e){$('status').textContent=e.message;}};
$('validate').onclick=async()=>{try{let result=await post('/api/validate',{positions_m:JSON.parse($('positions').value)});$('manualResult').textContent=JSON.stringify(result);}catch(e){$('manualResult').textContent=e.message}};
$('export').onclick=()=>{try{let blob=new Blob([JSON.stringify([{positions_m:JSON.parse($('positions').value),rationale:'manual_UI_proposal'}],null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='proposals.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){$('manualResult').textContent=e.message}};
async function init(){if(online){try{data=await(await fetch('/api/state')).json();$('mode').textContent=({live_jpeg:'实时 JPEG 接入 · 自动更新，点击标注后冻结画面',synthetic_test:'合成图像测试 · 不是实际采集',recorded_reference:'录制首帧测试 · 尚未连接实时相机'})[data.input_mode];}catch(e){$('mode').textContent='离线浏览 · 启动服务后可核验并保存';}}else{$('refresh').disabled=true;$('save').disabled=true;}
$('summary').textContent=`${data.layouts.filter(x=>x.guidance_ready).length} / ${data.layouts.length} 个布局通过 · 9 个深度/间距组合最终覆盖：${(data.guidance_coverage_counts||data.coverage_counts).join(' / ')}`;
data.layouts.forEach((l,i)=>{let option=document.createElement('option');option.value=i;option.textContent=l.id+(l.guidance_ready?' ✓':' ×');$('select').append(option);let card=document.createElement('div');card.className='card';card.innerHTML=`<img src="${l.id}/top.png"><span class="${l.guidance_ready?'good':'warn'}">${l.id} · ${l.guidance_ready?'通过':'未通过'}</span>`;card.onclick=()=>choose(i);$('gallery').append(card)});choose(0);await refresh();}
async function coverage(){if(!online){$('coverage').textContent='离线浏览：实际覆盖请在服务页面查看';return;}try{let c=await(await fetch('/api/coverage')).json();$('coverage').textContent=`实时人工核验覆盖：${c.unique_live_layouts} 个不同目标布局；录制图测试通过 ${c.accepted_records_by_mode.recorded_reference} 次。摆放核验不等于已录制轨迹。`;}catch(e){$('coverage').textContent='实际覆盖暂不可用';}}
init().then(()=>{coverage();if(data.input_mode==='live_jpeg')setInterval(()=>{if(!marking)refresh()},500);if(online)setInterval(coverage,5000)});
</script></html>
